services:
  api:
    build:
      context: ./sezzle-calculator-api
    image: sezzle-calculator-api:local
    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE:-prod}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./sezzle-calculator-web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: sezzle-calculator-web:local
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
